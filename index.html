<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Spin Arena — Phaser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #07080f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: "Trebuchet MS", system-ui, sans-serif;
      color: #d5dbe6;
    }
    #game-container {
      width: min(960px, 100vw);
      border: 2px solid #243044;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.45);
    }
    .hint { margin-top: 12px; font-size: 14px; color: #8b95a8; text-align: center; padding: 0 16px; }
    .hint kbd {
      background: #1c2433;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      color: #f4f7ff;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <p class="hint">
    Pick two balls · <kbd>WASD</kbd> push · click dash · <kbd>F</kbd> flip spin · <kbd>R</kbd> restart
  </p>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/Fighter.js"></script>
  <script src="js/scenes/BootScene.js"></script>
  <script src="js/scenes/MenuScene.js"></script>
  <script src="js/scenes/GameScene.js"></script>
  <script src="js/scenes/GameOverScene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
